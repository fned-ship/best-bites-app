<div class="dashboard-container">
  <h1 class="dashboard-title">Admin Dashboard</h1>

  <!-- Date Filter Controls -->
  <div class="filter-controls">
    <div class="filter-group">
      <label for="monthSelect">Month:</label>
      <select id="monthSelect" 
              [(ngModel)]="currentMonth" 
              (change)="onMonthChange(currentMonth)"
              class="filter-select">
        <option *ngFor="let month of getMonths()" [value]="month.value">
          {{ month.name }}
        </option>
      </select>
    </div>

    <div class="filter-group">
      <label for="yearSelect">Year:</label>
      <select id="yearSelect" 
              [(ngModel)]="currentYear" 
              (change)="onYearChange(currentYear)"
              class="filter-select">
        <option *ngFor="let year of getYears()" [value]="year">
          {{ year }}
        </option>
      </select>
    </div>

    <button (click)="loadAllAnalytics()" class="refresh-btn">
      🔄 Refresh All
    </button>
  </div>

  <!-- Daily Income Chart (Full Width) -->
  <div class="chart-section full-width">
    <div class="chart-card">
      <div *ngIf="loadingDailyIncome" class="loading">Loading daily income...</div>
      <div *ngIf="errorDailyIncome" class="error">{{ errorDailyIncome }}</div>
      
      <div *ngIf="!loadingDailyIncome && !errorDailyIncome && dailyIncomeChartData" 
           class="chart-container">
        <canvas baseChart
                [data]="dailyIncomeChartData"
                [options]="dailyIncomeChartOptions"
                [type]="'line'">
        </canvas>
      </div>
    </div>
  </div>

  <!-- Product Charts (Side by Side) -->
  <div class="chart-section two-columns">
    
    <!-- Product Income Percentage Chart -->
    <div class="chart-card">
      <div class="chart-header">
        <h3>Product Income Distribution</h3>
        <p class="total-value">Total Income: ${{ totalIncome.toFixed(2) }}</p>
      </div>
      
      <div *ngIf="loadingProductIncome" class="loading">Loading...</div>
      <div *ngIf="errorProductIncome" class="error">{{ errorProductIncome }}</div>
      
      <div *ngIf="!loadingProductIncome && !errorProductIncome && productIncomeChartData" 
           class="chart-container">
        <canvas baseChart
                [data]="productIncomeChartData"
                [options]="productIncomeChartOptions"
                [type]="'pie'">
        </canvas>
      </div>
    </div>

    <!-- Product Order Percentage Chart -->
    <div class="chart-card">
      <div class="chart-header">
        <h3>Product Order Distribution</h3>
        <p class="total-value">Total Orders: {{ totalOrders }}</p>
      </div>
      
      <div *ngIf="loadingProductOrders" class="loading">Loading...</div>
      <div *ngIf="errorProductOrders" class="error">{{ errorProductOrders }}</div>
      
      <div *ngIf="!loadingProductOrders && !errorProductOrders && productOrderChartData" 
           class="chart-container">
        <canvas baseChart
                [data]="productOrderChartData"
                [options]="productOrderChartOptions"
                [type]="'doughnut'">
        </canvas>
      </div>
    </div>
  </div>
</div>
