
<form [formGroup]="productForm" (ngSubmit)="onSubmit()" id="form">
  <h1>Editing product Id:{{prod._id}}</h1>
      <div class="input-group">
        <input
          type="text"
          id="name"
          placeholder="name of ingredient"
          formControlName="name"
          required
        />
      </div>
      <div class="input-group">
        <input
          type="text"
          id="description"
          placeholder="description"
          formControlName="description"
          required
        />
      </div>
      <div class="input-group" style="display: flex; gap:20px; align-items: center;">
        <h5>category:</h5>
        <select
          id="category"
          formControlName="category"
          required
        >
        <option *ngFor="let cat of  ['pizza', 'burger', 'dessert', 'drink', 'taco','salad']" [value]="cat" >  {{cat}}</option>
      </select>
      </div>
      <div class="input-group">
        <input
          type="number"
          min="0"
          id="price"
          placeholder= "price"
          formControlName="price"
          required
        />
      </div>
      
        <div class="input-group">
        <input
          type="number"
          min="1"
          id="ningredients"
          placeholder="Number of Ingredients"
          [(ngModel)]="n" [ngModelOptions]="{standalone: true}"
          required
        />

      </div>

      <div class="input-group" *ngFor="let f of [].constructor(n);index as i" style="display: flex; justify-content: space-between; align-items: center;" >
        <h5>Ingredient {{i+1}}: &nbsp;</h5>

        <select class="typeofIngredient" [(ngModel)]="ingredients[i]" [ngModelOptions]="{standalone: true}">
          <option *ngFor="let s of  stock" [value]="s._id" >  {{s.name}} </option>
        </select>
         <input
         class="quantityofIngredient"
          type="number"
          min="0"
          id="quantity"
          placeholder= "quantity"
          [(ngModel)]="quantity[i]" [ngModelOptions]="{standalone: true}"
          required
          
        />

      </div>
      <br/>
      <div class="input-file">
        <label for="inputTag">
          Change picture <br />
          <img src="svg/camera.svg" alt="camera" />
          <input
            id="inputTag"
            accept="image/*"
            type="file"
            (change)="handleFileChange($event)"
          />
          <br />
          <span
            id="imageName"
            [style.color]="ImageNameColor"
            style="word-break: break-word"
            >{{ imageName }}</span
          >
        </label>
      </div>
      <button type="submit" >Edit Product</button>
      <button type="button" id="back" (click)="back()">Back</button>
</form>
