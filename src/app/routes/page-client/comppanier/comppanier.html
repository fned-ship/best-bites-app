<main>
<table>
  <tr>
    <th>Item</th>
    <th>Prix</th>
    <th>Quantité</th>
  </tr>
</table>
<table>
  <tr *ngFor="let p of get()">
    <td >
      {{p.name}}
    </td>
    <td >
      {{p.price}}
    </td>
    <td >
      {{p.q}}
    </td>
  </tr>
</table>
<div style="width: 60vw; justify-content: space-between;">
    <h1>Total:</h1>
    <h2>{{total.toFixed(2)}} Dt</h2>
</div>
</main>
